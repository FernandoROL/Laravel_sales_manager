services:
  sistema_gestao:
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    command: ["sh", "docker/php/start.sh"]
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 2m

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8989}:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/laravel.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      sistema_gestao:
        condition: service_healthy

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Execute sh bin/setup}
      MYSQL_USER: ${DB_USERNAME:?Execute sh bin/setup}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Execute sh bin/setup}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ${MYSQL_DATA_LOCATION:-sales_db}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "--host=127.0.0.1", "--silent"]
      interval: 3s
      timeout: 5s
      retries: 45
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5-apache
    profiles: ["tools"]
    environment:
      PMA_HOST: mysql
    ports:
      - "127.0.0.1:${PMA_PORT:-8899}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  sales_db:
