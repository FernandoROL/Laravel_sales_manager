x-php: &php
  user: www-data
  pull_policy: never
  image: ${COMPOSE_PROJECT_NAME:-sales-manager}-php:local
  env_file:
    - path: .env
      required: false
  environment:
    APP_ENV: ${APP_ENV:-local}
    APP_URL: ${APP_URL:-http://localhost:8989}
    DB_HOST: ${DB_HOST:-mysql}
    DB_DATABASE: ${DB_DATABASE:-sistema_gestao}
    DB_USERNAME: ${DB_USERNAME:-sales_app}
    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-loja@example.test}
  volumes:
    - app_storage:/var/www/storage
    - app_key:/run/app-key:ro
    - db_password:/run/db-password:ro
    - ./app:/var/www/app:ro
    - ./resources:/var/www/resources:ro
    - ./routes:/var/www/routes:ro
    - ./public:/var/www/public:ro

services:
  credenciais:
    image: ${COMPOSE_PROJECT_NAME:-sales-manager}-php:local
    build: .
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - app_key:/run/app-key
      - db_password:/run/db-password
    command:
      - sh
      - -ec
      - |
        cd /run/app-key
        test -s key || (php /var/www/artisan key:generate --show --no-ansi > key.tmp && mv key.tmp key)
        cd /run/db-password
        test -s password || (printf '%s' "$${DB_PASSWORD:-$$(openssl rand -hex 32)}" > password.tmp && mv password.tmp password)

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    depends_on:
      credenciais:
        condition: service_completed_successfully
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sistema_gestao}
      MYSQL_USER: ${DB_USERNAME:-sales_app}
      MYSQL_PASSWORD_FILE: /run/db-password/password
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ${MYSQL_DATA_LOCATION:-sales_db}:/var/lib/mysql
      - db_password:/run/db-password:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "--host=127.0.0.1", "--silent"]
      interval: 3s
      timeout: 5s
      retries: 45
      start_period: 20s

  migracoes:
    <<: *php
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    depends_on:
      mysql:
        condition: service_healthy

  sistema_gestao:
    <<: *php
    depends_on:
      migracoes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 3s
      timeout: 3s
      retries: 25

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8989}:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/laravel.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      sistema_gestao:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:5-apache
    profiles: ["tools"]
    environment:
      PMA_HOST: mysql
    ports:
      - "127.0.0.1:${PMA_PORT:-8899}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  sales_db:
  app_storage:
  app_key:
  db_password:
